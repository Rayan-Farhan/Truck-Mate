services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_HOST: db
      DB_NAME: truckmate
      DB_USER: truckmate
      DB_PASSWORD: truckmate-local
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: truckmate
      POSTGRES_USER: truckmate
      POSTGRES_PASSWORD: truckmate-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckmate -d truckmate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - truckmate-db:/var/lib/postgresql/data
volumes:
  truckmate-db:
