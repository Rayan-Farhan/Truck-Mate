AWSTemplateFormatVersion: '2010-09-09'
Description: Private PostgreSQL storage for TruckMate fleet jobs
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
Resources:
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: TruckMate database subnets
      SubnetIds: !Ref Subnets
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access from TruckMate EC2
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      DBName: truckmate
      MasterUsername: truckmate_owner
      ManageMasterUserPassword: true
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      BackupRetentionPeriod: 7
      DeletionProtection: true
Outputs:
  Endpoint:
    Value: !GetAtt Database.Endpoint.Address
  MasterSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
